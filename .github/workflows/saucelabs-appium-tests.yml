name: Auto-build Aorta app & run saucelabs-appium based CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'       
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Patch Codebase for FontAwesome Compatibility
      run: |
        sed -i 's/Icons.cancel/FontAwesomeIcons.circleXmark/g' lib/core/utils/snackbars.dart
        sed -i 's/Icons.check_circle/FontAwesomeIcons.circleCheck/g' lib/core/utils/snackbars.dart

    - name: Build Android Debug APK
      run: flutter build apk --debug --android-skip-build-dependency-validation
      
    - name: Upload APK to Sauce Labs
      env:
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      run: |
        APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
        ls -lh "$APK_PATH"   # fail early if the build didn't produce it
    
        echo "Uploading APK to Sauce Labs EU Central..."
        RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
          -u "${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}" \
          -X POST "https://api.eu-central-1.saucelabs.com/v1/storage/upload" \
          -F "payload=@${APK_PATH}" \
          -F "name=app-debug.apk")
    
        echo "--- Sauce Labs API Response ---"
        echo "$RESPONSE"
        echo "-------------------------------"
    
        STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)
        if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
          echo "Error: Sauce Labs upload failed."
          exit 1
        fi
    
        FILE_ID=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d' | jq -r '.item.id')
        echo "SAUCE_APP_ID=storage:${FILE_ID}" >> "$GITHUB_ENV"



    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      working-directory: test/appium_saucelabs_cicd_integrationTest
      run: npm ci

    - name: Run tests on Sauce Labs
      working-directory: test/appium_saucelabs_cicd_integrationTest
      env:
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      run: npx wdio run wdio.conf.js --spec test/specs/aorta.js --logLevel debug

    - name: Upload Test Report Artifacts (Optional)
      uses: actions/upload-artifact@v4
      with:
        name: test-results-report
        path: test/appium_saucelabs_cicd_integrationTest/allure-results/
      if: always()
