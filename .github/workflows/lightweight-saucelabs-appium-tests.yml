name: Sauce Labs Lightweight Trigger Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sauce-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      working-directory: test/appium_saucelabs_cicd_integrationTest
      run: npm ci

    - name: Run tests on Sauce Labs
      working-directory: test/appium_saucelabs_cicd_integrationTest
      env:
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      run: npx wdio run wdio.conf.js --spec test/specs/aorta.js --logLevel debug

    - name: Generate Visual Test Report
      uses: simple-elf/allure-report-action@v1.11
      if: always()
      with:
        allure_results: test/appium_saucelabs_cicd_integrationTest/allure-results
        allure_report: allure-report
        allure_history: allure-history

    - name: Upload HTML Report Dashboard
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: visual-html-report-lightweight
        path: allure-report/
        if-no-files-found: warn
        retention-days: 14

