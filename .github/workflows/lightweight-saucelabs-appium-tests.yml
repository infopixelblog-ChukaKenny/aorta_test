name: Sauce Labs Lightweight Trigger Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-sauce-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node dependencies
      working-directory: test/appium_saucelabs_cicd_integrationTest
      run: npm ci

    - name: Run tests on Sauce Labs
      working-directory: test/appium_saucelabs_cicd_integrationTest
      env:
        SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
        SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      run: npx wdio run wdio.conf.js --spec test/specs/aorta.js --logLevel debug

    - name: Generate Allure report
      if: always()
      run: |
        ls -la test/appium_saucelabs_cicd_integrationTest/allure-results || echo "No allure-results found"
        npx --yes allure-commandline generate test/appium_saucelabs_cicd_integrationTest/allure-results --clean -o allure-report

    - name: Upload HTML Report Dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-html-report-lightweight
        path: allure-report/
        if-no-files-found: warn
        retention-days: 14


